layout: default
title: A la découverte d'*Impact Framework*.
subtitle: 10 avril 2025 — Ludovic Dussart
theme:
  # The fixed 1920x1080 stage, scaled to fit whatever it is projected on.
  stage: true
  # Renders the theme switcher: t toggles light/dark, d cycles the display
  # profile (screen / tv / projector).
  dark: true
logos:
  - /images/zatsit_logo.svg
  - /images/logo.jpg
# Dark-theme counterparts, and the order has to match logos above: in dark
# mode every entry of that list is hidden and this one shown in its place, so
# a shorter list here makes the missing logos disappear rather than fall back.
#
# logo.jpg is repeated as-is on purpose: it is a JPEG on an opaque white
# background and has no dark variant yet. Repeating it keeps the partner on
# the slide -- as a white plate, which reads as a logo rather than as a bug --
# until a transparent version replaces it here.
logosDark:
  - /images/zatsit_logo_or.svg
  - /images/logo.jpg
